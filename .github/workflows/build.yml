name: Build and Release XOUltra-AI

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter pillow websocket-client

    # networks/ bắt buộc cho engine luật Chặn 2 đầu trên Windows
    - name: Verify required files (Windows)
      shell: bash
      run: |
        set -e
        echo "=== Repo root ==="
        ls -la
        missing=0
        for f in \
          "XOUltra-AI.py" \
          "translations.json" \
          "Ultra.ico" \
          "pbrain-rapfi-windows-avx2.exe" \
          "pbrain-alphagomoku-caro.exe" \
          "sounds" \
          "icons" \
          "networks"
        do
          if [ ! -e "$f" ]; then
            echo "MISSING: $f"
            missing=1
          else
            echo "OK: $f"
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo ""
          echo "ERROR: Thiếu file/thư mục bắt buộc (thường là networks/ chưa push lên GitHub)."
          echo "  git add networks/"
          echo "  git commit -m \"Add AI networks\""
          echo "  git push"
          echo "Nếu bị ignore: kiểm tra .gitignore rồi bỏ dòng networks."
          exit 1
        fi
        echo "=== networks (sample) ==="
        ls -la networks | head -20

    - name: Build with PyInstaller (Windows)
      shell: cmd
      run: >
        pyinstaller --clean --noconsole --onefile --name "XOUltra-AI"
        --icon "Ultra.ico"
        --add-data "Ultra.ico;."
        --add-data "translations.json;."
        --add-data "pbrain-rapfi-windows-avx2.exe;."
        --add-data "pbrain-alphagomoku-caro.exe;."
        --add-data "networks;networks"
        --add-data "sounds;sounds"
        --add-data "icons;icons"
        "XOUltra-AI.py"
        && move dist\XOUltra-AI.exe .

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XOUltraAI-Windows
        path: XOUltra-AI.exe

  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter pillow websocket-client

    - name: Make engine executable
      run: chmod +x pbrain-rapfi-mac

    - name: Verify required files (macOS)
      run: |
        set -e
        for f in XOUltra-AI.py translations.json Ultra.icns pbrain-rapfi-mac sounds icons; do
          if [ ! -e "$f" ]; then
            echo "MISSING: $f"
            exit 1
          fi
          echo "OK: $f"
        done

    - name: Build with PyInstaller (macOS)
      run: |
        pyinstaller --clean --noconsole --onefile --name "XOUltra-AI" \
          --icon "Ultra.icns" \
          --add-data "Ultra.icns:." \
          --add-data "translations.json:." \
          --add-data "pbrain-rapfi-mac:." \
          --add-data "sounds:sounds" \
          --add-data "icons:icons" \
          "XOUltra-AI.py"
        mv dist/XOUltra-AI .
        chmod +x "XOUltra-AI"

    - name: Upload Mac Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XOUltraAI-MacOS
        path: XOUltra-AI

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: XOUltraAI-Windows
        path: ./artifacts-win

    - name: Download Mac Artifact
      uses: actions/download-artifact@v4
      with:
        name: XOUltraAI-MacOS
        path: ./artifacts-mac

    - name: Rename files for release
      run: |
        mv ./artifacts-win/XOUltra-AI.exe ./artifacts-win/XOUltra-AI-Windows.exe
        mv ./artifacts-mac/XOUltra-AI ./artifacts-mac/XOUltra-AI-MacOS

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts-win/XOUltra-AI-Windows.exe
          ./artifacts-mac/XOUltra-AI-MacOS
        tag_name: release-${{ github.run_number }}
        name: XOUltra-AI v1.0.${{ github.run_number }}
        body: |
          Automatic release for the XOUltra-AI game.

          🪟 **Windows**: Download `XOUltra-AI-Windows.exe`
          - Luật Tiêu chuẩn
          - Luật Chặn 2 đầu (AI hỗ trợ đầy đủ, bàn 15×15)

          🍏 **macOS**: Download `XOUltra-AI-MacOS`
          - Luật Tiêu chuẩn (AI đầy đủ)
          - Luật Chặn 2 đầu: AI vẫn suy nghĩ theo Tiêu chuẩn; chơi 2 Người / Online vẫn chấm thắng đúng

          > macOS: lần đầu mở → chuột phải → Open để bỏ qua Gatekeeper.
        draft: false
        prerelease: false
